<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лови звёзды ⭐</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="game">

    <h1>⭐ ЛОВИ ЗВЁЗДЫ ⭐</h1>

    <div class="stats">
        <div>Очки: <span id="score">0</span></div>
        <div>Время: <span id="time">30</span></div>
        <div>Рекорд: <span id="record">0</span></div>
    </div>

    <button id="start">НАЧАТЬ ИГРУ</button>

    <div id="gameArea">
        <div id="star">⭐</div>
    </div>

    <div id="message"></div>

</div>

<script src="script.js"></script>

</body>
</html>
